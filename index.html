<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 6.8</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="services">
        <img src="./image/burger.svg" alt="burger" />
        <img src="./image/logo.svg" alt="logo" />
      </div>
      <div class="services">
        <!-- поменяла местами изображения -->
        <img src="./image/call.png" alt="call" />
        <img src="./image/chat.png" alt="chat" />
        <img src="./image/profile.png" alt="profile" />
        <img src="./image/repair.svg" alt="repair" />
        <img src="./image/checkstatus.png" alt="checkstatus" />
      </div>
    </header>
    <main>
      <div class="main-container">
        <h1>Услуги и сервисы</h1>
        <div class="rights">
          <span>Оставить заявку</span>
          <img src="./image/repair.svg" alt="repair" />
          <span>Статус ремонта</span>
          <img src="./image/checkstatus.png" alt="checkstatus" />
        </div>
      </div>

      <div class="buttons">
        <button class="button1">Ремонтируемые бренды</button>
        <button class="tablet-button">Дополнительные услуги</button>
        <button class="button2">Ремонтируемые устройства</button>
        <button class="button3">Цены на услуги</button>
        <button class="button4">Адреса сервисных центров</button>
        <button class="button5">Специальные цены</button>
      </div>
      <button class="button6">Отзывы</button>
      <!-- </div> -->

      <div class="image-container">
        <div class="image-box">
          <img src="./image/text.png" alt="text" width="288" height="90" />
          <div class="icon-box">
            <img src="./image/expand.png" alt="expand" width="24" height="24" />
            <p>Читать далее</p>
          </div>
        </div>
        <div class="image-box">
          <img src="./image/image.png" alt="image" width="320" height="322" />
        </div>
      </div>
    </main>
  </body>
</html>
